<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form onsubmit="clickHandler(); return false;">

        <label>Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Course:</label>
        <input type="text" id="course" name="course" placeholder="Enter your course">
        <br><br>

        <label>Branch:</label>
        <input type="text" id="branch" name="branch" placeholder="Enter your branch">
        <br><br>

        <label>Section:</label>
        <input type="text" id="section" name="section" placeholder="Enter your section">
        <br><br>

        <label>Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password">
        <br><br>

        <label>Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password">
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

    <h2>Registered Students</h2>

    <div id="students"></div>

    <script src="script.js"></script>

</body>
</html>
